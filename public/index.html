<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b4f6c">
  <title>Bahr Network — Attendance</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar" id="topbar" hidden>
    <div class="brand">
      <img src="/icon.svg" alt="" width="32" height="32">
      <div>
        <strong id="company-name">Bahr Network</strong>
        <small id="user-name"></small>
      </div>
    </div>
    <button class="btn ghost small" id="logout-btn" type="button">Log out</button>
  </header>
  <nav class="tabs" id="nav" hidden></nav>
  <main id="app" class="container"></main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <dialog id="modal"></dialog>
  <script src="/app.js"></script>
</body>
</html>
